<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>singlet viewer harness</title>
<style>
  :root { --ink:#0A0A0A; --bone:#EDE7DA; --gold:#FFC30B; --muted:#8A857A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ink); color:var(--bone);
         font-family:"Archivo",system-ui,sans-serif; overflow-x:clip; }
  .hero { height:280vh; position:relative; }
  .stage { position:sticky; top:0; height:100vh; display:grid; place-items:center; }
  .glow { position:absolute; inset:0;
          background:radial-gradient(60% 55% at 50% 42%, rgba(255,195,11,.10), transparent 70%); }
  .wrap { padding-top:64px; }
  singlet-viewer { width:min(88vw,700px); height:min(72vh,700px); }
  singlet-viewer:not([data-ready]) { opacity:0; }
  singlet-viewer { transition:opacity .6s ease; }
  .scrim { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(10,10,10,.94) 0%, rgba(10,10,10,.72) 22%,
      transparent 42%, transparent 62%, rgba(10,10,10,.72) 84%, rgba(10,10,10,.95) 100%); }
  .top { position:absolute; inset:0 0 auto 0; padding:96px 24px 0; text-align:center; pointer-events:none; }
  .eyebrow { color:var(--gold); font-size:11px; letter-spacing:.34em; text-transform:uppercase; }
  h1 { font-family:"Archivo Black",system-ui,sans-serif; font-size:clamp(44px,10.5vw,158px);
       line-height:.86; letter-spacing:-.03em; text-transform:uppercase; margin:.2em 0 0;
       text-shadow:0 6px 40px rgba(10,10,10,.85); }
</style>
</head>
<body>
  <section class="hero">
    <div class="stage">
      <div class="glow"></div>
      <div class="wrap"><singlet-viewer id="v" src="./singlet.glb"></singlet-viewer></div>
      <div class="scrim"></div>
      <div class="top">
        <div class="eyebrow">Vol. 01, Limited Drop</div>
        <h1>Race Day<br>Singlet</h1>
      </div>
    </div>
  </section>
  <script>
    // surface load failures to the test runner
    window.__err = [];
    addEventListener('error', e => window.__err.push(String(e.message || e.error)), true);
    addEventListener('unhandledrejection', e => window.__err.push(String(e.reason)));
  </script>
  <script src="./singlet-viewer.js"></script>
</body>
</html>
